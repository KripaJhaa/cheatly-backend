<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cheatly checkout</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#f7f6f0;color:#172622;font:16px system-ui,sans-serif}.card{width:min(440px,calc(100% - 40px));padding:32px;border:1px solid #dce1d9;border-radius:16px;background:#fffdf8;box-shadow:0 18px 40px #17262218}h1{margin:0 0 10px}p{color:#718079;line-height:1.55}button{width:100%;padding:14px;border:0;border-radius:8px;color:#fff;background:#172622;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.5}#message{min-height:24px;color:#34775e}</style></head><body><main class="card"><h1>Cheatly lifetime access</h1><p>Complete the secure Razorpay payment. Your payment is linked to this Cheatly session automatically.</p><p id="message">Preparing secure checkout…</p><button id="pay" disabled>Pay securely</button></main><script>
const sessionID=new URLSearchParams(location.search).get('session_id'),message=document.getElementById('message'),button=document.getElementById('pay');let config;
async function start(){if(!sessionID){message.textContent='Missing checkout session.';return}try{config=await (await fetch('/api/config')).json();const order=await (await fetch('/api/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionID})})).json();if(!order.order_id)throw new Error(order.error||'Could not create order');button.disabled=false;message.textContent='Ready when you are.';button.onclick=()=>{const checkout=new Razorpay({key:config.keyID,amount:order.amount,currency:order.currency,name:config.name,description:config.description,order_id:order.order_id,handler:async response=>{const result=await (await fetch('/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...response,session_id:sessionID})})).json();message.textContent=result.message||'Payment received. You can return to Cheatly.';button.disabled=true},theme:{color:'#34775e'}});checkout.on('payment.failed',()=>message.textContent='Payment was not completed. You can try again.');checkout.open()}}catch(error){message.textContent=error.message||'Unable to prepare checkout.'}}start();
</script></body></html>
