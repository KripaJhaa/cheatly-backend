<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your Cheatly access</title>
  <style>
    *{box-sizing:border-box}body{margin:0;display:grid;place-items:center;min-height:100vh;padding:24px;background:#f7f6f0;color:#172622;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(680px,100%);padding:34px;border:1px solid #dce1d9;border-radius:20px;background:#fffdf8;box-shadow:0 18px 50px #17262218}h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px);letter-spacing:-.04em}p{color:#718079;line-height:1.55}.status{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:26px 0;padding:18px;border-radius:14px;background:#edf5e8}.status strong{font-size:21px}.status span{color:#34775e;font-weight:700}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #e4e8e1;color:#5f7069}.row strong{color:#172622}a{color:#34775e;font-weight:700}.small{font-size:13px}@media(max-width:560px){.card{padding:24px}.status{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="card">
    <p class="small">CHEATLY PROFILE</p>
    <h1>Your access, at a glance.</h1>
    <p id="message">Loading your Cheatly profile…</p>
    <section id="profile" hidden>
      <div class="status"><strong id="status">—</strong><span id="expiry">—</span></div>
      <div class="row"><span>Email</span><strong id="email">—</strong></div>
      <div class="row"><span>Plan</span><strong id="plan">—</strong></div>
      <h2>Payment history</h2>
      <div id="payments"></div>
      <p class="small">Need help? Join the Cheatly community for support.</p>
    </section>
  </main>
  <script>
    const sessionID = new URLSearchParams(location.search).get('session_id');
    const message = document.getElementById('message');
    const profile = document.getElementById('profile');
    const apiBase = location.origin;
    const date = (value) => value ? new Date(value).toLocaleDateString('en-IN', { dateStyle: 'medium' }) : 'Not set';
    async function start() {
      if (!sessionID) { message.textContent = 'This profile link is missing its session.'; return; }
      try {
        const response = await fetch(`${apiBase}/api/profile?session_id=${encodeURIComponent(sessionID)}`);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not load your profile');
        document.getElementById('status').textContent = result.customer.status === 'paid' ? 'Paid access active' : result.customer.status === 'trial' ? 'Trial active' : 'Access expired';
        document.getElementById('expiry').textContent = `${result.customer.status === 'paid' ? 'Access until' : 'Trial until'} ${date(result.customer.paid_until || result.customer.trial_expires_at)}`;
        document.getElementById('email').textContent = result.customer.email || '—';
        document.getElementById('plan').textContent = result.customer.plan_key || 'Seven-day trial';
        const payments = document.getElementById('payments');
        payments.replaceChildren();
        if (result.payments.length) {
          result.payments.forEach((payment) => {
            const row = document.createElement('div');
            row.className = 'row';
            const when = document.createElement('span');
            when.textContent = date(payment.created_at);
            const detail = document.createElement('strong');
            detail.textContent = `${payment.status} · ${payment.currency} ${(payment.amount_paise / 100).toLocaleString('en-IN')}`;
            row.append(when, detail);
            payments.append(row);
          });
        } else {
          const empty = document.createElement('p');
          empty.textContent = 'No payments recorded yet.';
          payments.append(empty);
        }
        message.hidden = true;
        profile.hidden = false;
      } catch (error) { message.textContent = error.message || 'Could not load your profile.'; }
    }
    start();
  </script>
</body>
</html>
